# Local / dev docker-compose — incluye Postgres + Mailhog para desarrollo local.
# Produccion (Postgres en el HOST): usar docker-compose.prod.yml

name: ${COMPOSE_PROJECT_NAME:-flit-dev}

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user_davidch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-dev_db_davidch}
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-user_davidch} -d ${POSTGRES_DB:-dev_db_davidch}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - flit_pg_data:/var/lib/postgresql/data
    restart: *restart
    logging: *default-logging

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: *restart
    logging: *default-logging

  core-api:
    build:
      context: ./services/core-api
      dockerfile: Dockerfile
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/core-api:${CORE_API_TAG:-develop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Development}
      # Gateway YARP (appsettings.Docker.json) enruta a http://core-api:8081
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=${POSTGRES_DB:-dev_db_davidch};Username=${POSTGRES_USER:-user_davidch};Password=${POSTGRES_PASSWORD:-changeme};SSL Mode=Disable
      Cors__AllowedOrigins: ${CORS_ORIGIN:-https://dev.davidch.flitsas.online}
      Jwt__DevGenerate: "true"
      Identity__BootstrapEmail: super@flit.local
      Identity__BootstrapPassword: ${IDENTITY_BOOTSTRAP_PASSWORD:-FlitDev2026!}
      Smtp__Host: mailhog
      Smtp__Port: "1025"
      Smtp__UseSsl: "false"
      Smtp__From: identity@flit.local
      App__PublicBaseUrl: ${CORS_ORIGIN:-http://localhost:3000}
      Verifik__BearerToken: ${VERIFIK_API_TOKEN:-}
      Verifik__BaseUrl: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      Verifik__TimeoutSeconds: ${VERIFIK_TIMEOUT_SECONDS:-30}
      Procedures__DocumentStoragePath: /data/procedure-docs
    volumes:
      - flit_procedure_docs:/data/procedure-docs
    ports:
      - "127.0.0.1:${CORE_API_PORT:-40302}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/gateway:${GATEWAY_TAG:-develop}
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://dev.davidch.flitsas.online}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-40202}:8080"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/frontend:${FRONTEND_TAG:-develop}
    environment:
      API_BASE_URL: http://gateway:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: *restart
    logging: *default-logging

volumes:
  flit_pg_data:
  flit_procedure_docs:
