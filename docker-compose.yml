# Local / dev docker-compose — misma topologia que produccion.
# Ver docker-compose.prod.yml para documentacion de variables.

name: ${COMPOSE_PROJECT_NAME:-flit-dev}

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  core-api:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/core-api:${CORE_API_TAG:-develop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Development}
      ConnectionStrings__Identity: ${CONNECTION_STRING_CORE}
      Cors__AllowedOrigins: ${CORS_ORIGIN:-https://dev.davidch.flitsas.online}
      Jwt__DevGenerate: "true"
      Verifik__BearerToken: ${VERIFIK_API_TOKEN:-}
      Verifik__BaseUrl: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      Verifik__TimeoutSeconds: ${VERIFIK_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${CORE_API_PORT:-40302}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  gateway:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/gateway:${GATEWAY_TAG:-develop}
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://dev.davidch.flitsas.online}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-40202}:8080"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  frontend:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/frontend:${FRONTEND_TAG:-develop}
    environment:
      API_BASE_URL: http://gateway:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-40102}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: *restart
    logging: *default-logging
