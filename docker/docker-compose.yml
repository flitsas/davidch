services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flit
      POSTGRES_PASSWORD: flit_dev
      POSTGRES_DB: flit_identity
    ports:
      - "5432:5432"
    volumes:
      - flit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flit -d flit_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  identity-api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "5080:5080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Identity: Host=postgres;Port=5432;Database=flit_identity;Username=flit;Password=flit_dev
      Identity__BootstrapEmail: ${IDENTITY_BOOTSTRAP_EMAIL:-super@flit.local}
      Identity__BootstrapPassword: ${IDENTITY_BOOTSTRAP_PASSWORD:-FlitDev2026!}
      Jwt__Issuer: flit-identity
      Jwt__Audience: flit-app
      Jwt__PrivateKeyPath: /app/keys/jwt-private.pem
      Jwt__PublicKeyPath: /app/keys/jwt-public.pem
      Smtp__Host: mailhog
      Smtp__Port: 1025
      Smtp__UseSsl: "false"
      Smtp__From: identity@flit.local
      App__PublicBaseUrl: http://localhost:3000
    volumes:
      - ../backend/keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://identity-api:5080
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://identity-api:5080
    depends_on:
      identity-api:
        condition: service_healthy

volumes:
  flit_pg_data:
