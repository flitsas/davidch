# Production docker-compose — VPS deploy (topologia slim: front + gateway + core-api).
#
# Postgres NO esta aqui: corre en el HOST (host.docker.internal:5432).
# El reverse-proxy del HOST termina TLS y enruta los dominios a los puertos
# publicados en 127.0.0.1:
#   dev.davidch.flitsas.online      -> frontend  (127.0.0.1:40102)
#   dev.api.davidch.flitsas.online  -> gateway   (127.0.0.1:40202)  [API publica YARP]
#   core (debug)                    -> core-api  (127.0.0.1:40302)
#
# Variables requeridas en .env (junto al compose):
#   CONNECTION_STRING_CORE  cadena Npgsql .NET (Host=...;Port=5432;Database=...;Username=...;Password=...)
#   CORS_ORIGIN             origen permitido del frontend (https://dev.davidch.flitsas.online)
#   VERIFIK_API_TOKEN       token Verifik (RUNT)
# Variables para AISLAR este proyecto del resto del VPS (UNICAS por proyecto):
#   COMPOSE_PROJECT_NAME    nombre del proyecto Compose (default: flit-dev)
#   FRONTEND_PORT / GATEWAY_PORT / CORE_API_PORT   puertos host 127.0.0.1
# Variables opcionales:
#   CORE_API_TAG / FRONTEND_TAG / GATEWAY_TAG   tag de imagen (default: develop)
#   VERIFIK_BASE_URL / VERIFIK_TIMEOUT_SECONDS
#
# NOTA: login deshabilitado temporalmente -> Jwt__DevGenerate genera llaves efimeras.
#
# Despliegue:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans

# Nombre del proyecto: UNICO por proyecto en el VPS. Si dos repos comparten el
# mismo nombre, `up --remove-orphans` borra los contenedores del otro. Sobrescribir
# con COMPOSE_PROJECT_NAME en el .env de cada proyecto.
name: ${COMPOSE_PROJECT_NAME:-flit-dev}

x-restart-policy: &restart unless-stopped

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # ── Flit.Identity.Api (interno, detras de YARP) ───────────────────────────
  core-api:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/core-api:${CORE_API_TAG:-develop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENV:-Production}
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__Identity: ${CONNECTION_STRING_CORE}
      Cors__AllowedOrigins: ${CORS_ORIGIN:-https://dev.davidch.flitsas.online}
      Jwt__DevGenerate: "true"
      Verifik__BearerToken: ${VERIFIK_API_TOKEN:-}
      Verifik__BaseUrl: ${VERIFIK_BASE_URL:-https://api.verifik.co}
      Verifik__TimeoutSeconds: ${VERIFIK_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${CORE_API_PORT:-40302}:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: *restart
    logging: *default-logging

  # ── Flit.Gateway (API publica YARP: /api, /hubs) ──────────────────────────
  gateway:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/gateway:${GATEWAY_TAG:-develop}
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-https://dev.davidch.flitsas.online}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-40202}:8080"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: *restart
    logging: *default-logging

  # ── Frontend (Next.js standalone) ─────────────────────────────────────────
  frontend:
    image: ghcr.io/flitsas/${IMAGE_NAMESPACE:-davidch-dev}/frontend:${FRONTEND_TAG:-develop}
    environment:
      API_BASE_URL: http://gateway:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-40102}:3000"
    depends_on:
      gateway:
        condition: service_healthy
    restart: *restart
    logging: *default-logging
